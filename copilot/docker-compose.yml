version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: copilot/Dockerfile
    container_name: copilot_api
    ports:
      - "8000:8000"
    environment:
      - COPILOT_API_KEY=${COPILOT_API_KEY:-dev-secret-key}
    volumes:
      - ../outputs:/app/outputs
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: copilot_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    restart: unless-stopped

volumes:
  n8n_data:
